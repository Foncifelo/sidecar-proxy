name: release

# A pushed tag v* builds the sidecar binary for linux/darwin/windows × amd64/arm64 and
# creates a DRAFT GitHub release with archives, checksums.txt, SBOMs, a cosign keyless
# signature bundle of checksums.txt and a GitHub build-provenance attestation of every
# archive. A person publishes the draft after reading the notes. No repository secret is
# needed: GITHUB_TOKEN is automatic and cosign and the attestation sign with the job's
# OIDC token.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the draft release and upload assets
  id-token: write      # cosign keyless (OIDC) and build provenance
  attestations: write  # build provenance

env:
  GOTOOLCHAIN: local

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { fetch-depth: 0, persist-credentials: false }
      # A supported Go release with the latest patch, not the go.mod floor (1.25.0):
      # the shipped binary embeds the standard library of the toolchain that builds it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.x", check-latest: true, cache: true }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.1.4 }
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with: { syft-version: v1.54.1 }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt
